name: postspark-capture
services:
  capture:
    image: ${POSTSPARK_CAPTURE_IMAGE:?Set the verified capture image}
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: [/opt/postspark-capture/shared/capture.env]
    ports: ["127.0.0.1:3001:3000"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    shm_size: 128mb
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 160
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
