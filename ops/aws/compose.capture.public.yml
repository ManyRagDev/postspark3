# Add only after DNS points to the host and AWS ports 80/443 are configured.
services:
  https:
    image: ${POSTSPARK_CADDY_IMAGE:?Set a verified official Caddy image}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      POSTSPARK_CAPTURE_HOST: ${POSTSPARK_CAPTURE_HOST:?Set the capture hostname}
    volumes:
      - ./Caddyfile.capture:/etc/caddy/Caddyfile:ro
      - capture_caddy_data:/data
      - capture_caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 128m
    pids_limit: 80
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  capture_caddy_data:
  capture_caddy_config:
